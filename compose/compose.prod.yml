name: prairielearn
services:
  pl:
    image: ${PL_IMAGE:?Нужен exact PL image}
    pull_policy: never
    entrypoint: [/bin/sh, /platform/start-pl.sh]
    command: [/PrairieLearn/scripts/start-gateway-bridge.sh]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PL_GATEWAY_CONFIG: /run/pl-gateway/config.json
      HOST_JOBS_DIR: ${HOST_JOBS_DIR:?Нужен абсолютный существующий jobs path}
    volumes:
      - type: bind
        source: ../tools
        target: /PrairieLearn/apps/prairielearn/bridge/operator-tools
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../tools/start-pl.sh
        target: /platform/start-pl.sh
        read_only: true
        bind: {create_host_path: false}
      - postgres:/var/postgres
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOST_JOBS_DIR}
        target: /jobs
        bind: {create_host_path: false}
      - type: bind
        source: ${PL_PRIVATE:?Нужен каталог приватной конфигурации}
        target: /run/pl-gateway
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PL_PRIVATE}/pl.json
        target: /PrairieLearn/config.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COURSE_DIR:?Нужен проверенный native course}
        target: /course
        read_only: true
        bind: {create_host_path: false}
    cpus: 2
    mem_limit: 5g
    healthcheck:
      test: [CMD, curl, --fail, http://127.0.0.1:3000/pl/webhooks/ping]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
  gateway:
    image: ${GATEWAY_IMAGE:?Нужен exact Gateway image}
    pull_policy: never
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    depends_on:
      pl: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${GATEWAY_PRIVATE:?Нужен private Gateway config}
        target: /run/config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COURSE_DIR}
        target: /native
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GATEWAY_DATA:?Нужен постоянный каталог Gateway SQLite}
        target: /var/lib/gateway
        bind: {create_host_path: false}
    mem_limit: 256m
    cpus: 0.5
  proxy:
    image: ${NGINX_IMAGE:?Нужен exact nginx image}
    pull_policy: never
    ports: ["${PL_BIND_IP:?Нужен IP VM}:443:443"]
    depends_on:
      gateway: {condition: service_started}
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    volumes:
      - type: bind
        source: ${NGINX_CONFIG:?Нужен nginx config}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PROXY_PRIVATE:?Нужен private proxy каталог}
        target: /etc/nginx/private
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TLS_DIR:?Нужен TLS каталог}
        target: /tls
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 128m
    cpus: 0.5
volumes:
  postgres: {}
