# Overlay для приватного PL service без публичного Bridge порта.
services:
  pl:
    image: ${PL_GATEWAY_IMAGE:?set the reviewed versioned derived bridge image}
    command: ["/PrairieLearn/scripts/start-gateway-bridge.sh"]
    build:
      context: ..
      dockerfile: images/prairielearn/Dockerfile
    environment:
      NODE_ENV: production
      PL_GATEWAY_CONFIG: /run/pl-gateway/config.json
    volumes:
      - ${PL_GATEWAY_CONFIG_PATH:?private config required}:/run/pl-gateway/config.json:ro
      - ${PL_GATEWAY_TOKEN_PATH:?private token required}:/run/secrets/pl-gateway-token:ro
