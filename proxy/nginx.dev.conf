worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location = /healthz { return 200 'ok\n'; add_header Content-Type text/plain; }
    location = / { return 302 /pl/; }
    # No unauthenticated request reaches PL's trusted-header callback.
    location = /pl/shibcallback { return 503; }
    location ^~ /pl/shibcallback/ { return 503; }
    location = /gateway { return 503; }
    location ^~ /gateway/ { return 503; }
    location /pl/ {
      include /etc/nginx/pl-headers.conf;
      proxy_pass http://pl:3000;
    }
    location = /pl { return 302 /pl/; }
    # The pinned PL image serves Socket.IO outside urlPrefix /pl.
    location /socket.io/ {
      include /etc/nginx/pl-headers.conf;
      proxy_pass http://pl:3000;
    }
    location / { return 404; }
  }
}
