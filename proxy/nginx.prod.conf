worker_processes auto;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $handoff_course $handoff_suffix { default /courses/$handoff_course; "" ""; }
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /healthz { return 200 'ok\n'; }
    location = / { return 302 /pl/; }
    location = /gateway { return 302 /pl/; }
    location = /gateway/ { return 302 /pl/; }
    location ~ "^/gateway/(?:courses/(?<handoff_course>[a-z][a-z0-9-]*)/)?pl/(?<opaque_handoff>[A-Za-z0-9_-]{43})$" {
      limit_except GET { deny all; }
      set $handoff_token $opaque_handoff;
      auth_request /__verified_handoff;
      auth_request_set $verified_uid $upstream_http_x_verified_uid;
      auth_request_set $verified_name_utf8_b64 $upstream_http_x_verified_name_utf8_b64;
      auth_request_set $verified_target $upstream_http_x_verified_target;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid $verified_uid;
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 $verified_name_utf8_b64;
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_set_header Cookie "pl2_pre_auth_url=$verified_target";
      rewrite ^ /pl/shibcallback break;
      proxy_pass http://pl:3000;
    }
    location = /__verified_handoff {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie "";
      include /etc/nginx/private/handoff-auth.conf;
      proxy_pass http://gateway:18080/internal/handoff$handoff_suffix/$handoff_token;
    }
    location /gateway/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_pass http://gateway:18080;
    }
    location /internal/ { return 404; }
    location = /pl/shibcallback { return 403; }
    location ^~ /pl/shibcallback/ { return 403; }
    location = /favicon.ico {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_pass http://pl:3000;
    }
    location ^~ /assets/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_pass http://pl:3000;
    }
    location /pl/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_pass http://pl:3000;
    }
    location /socket.io/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://pl:3000;
    }
    location / { return 404; }
  }
}
