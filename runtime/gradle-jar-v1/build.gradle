plugins { id 'java' }

def nativeConfig = new groovy.json.JsonSlurper().parse(file('native-config.json'))
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
sourceSets {
    main {
        java { setSrcDirs([]) }
        resources { setSrcDirs([]) }
        output.classesDirs.setFrom(files('production-classes'))
    }
    test { java { setSrcDirs([]) }; resources { setSrcDirs([]) } }
}
// Supervisor передаёт единственный результат javac --release 25 только для чтения.
tasks.withType(JavaCompile).configureEach { enabled = false }
tasks.named('jar') {
    archiveFileName = nativeConfig.artifact
    if (nativeConfig.containsKey('mainClass')) {
        manifest { attributes('Main-Class': nativeConfig.mainClass) }
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('test') { enabled = false }
