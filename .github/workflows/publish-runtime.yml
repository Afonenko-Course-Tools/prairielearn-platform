name: Publish reviewed Platform images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable runtime version (например 2.0.0)
        required: true
        type: string
      reviewed_commit:
        description: Exact independently reviewed merged main commit
        required: true
        type: string
      exporter_commit:
        description: Точный проверенный commit Exporter для synthetic delivery4 packages (только components=all)
        required: false
        type: string
      components:
        description: Полный набор runtime, только Community или только Java
        required: true
        type: choice
        default: all
        options:
          - all
          - community
          - java
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-platform-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.components == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve immutable version
        env:
          VERSION: ${{ inputs.version }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          EXPORTER_COMMIT: ${{ inputs.exporter_commit }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$EXPORTER_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$COMPONENTS" == all ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$REVIEWED_COMMIT" ]] || exit 1
          [[ "$(cat VERSION)" == "$VERSION" ]] || exit 1
          {
            echo "VERSION=$VERSION"
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/java25-grader:${VERSION}"
            echo "RUNTIME_IMAGE=$IMAGE"
            echo "FISH_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fish-git-grader:${VERSION}"
            echo "COMMUNITY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prairielearn-community-gateway:${VERSION}"
            echo "WORKSPACE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sp-git-workspace:${VERSION}"
          } >> "$GITHUB_ENV"
      - name: Authenticate with scoped package token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Подтвердить отсутствие всех четырёх registry tags
        run: |
          for IMAGE in "$RUNTIME_IMAGE" "$COMMUNITY_IMAGE" "$FISH_IMAGE" "$WORKSPACE_IMAGE"; do bash tools/require-absent-image.sh "$IMAGE"; done
      - name: Получить точный Exporter для synthetic contract fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          ref: ${{ inputs.exporter_commit }}
          path: .ci-deps/exporter
          persist-credentials: false
      - name: Проверить исходник producer
        env:
          EXPORTER_COMMIT: ${{ inputs.exporter_commit }}
        run: test "$(git -C .ci-deps/exporter rev-parse HEAD)" = "$EXPORTER_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 8aba3b47df161c98645f3fc268adefc2e96ef8d3
          path: .ci-deps/core
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C .ci-deps/core rev-parse HEAD
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "8aba3b47df161c98645f3fc268adefc2e96ef8d3"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 0b62c6501d716a634e0d1e3fcc3d21e41142b5a1
          path: .ci-deps/qrc
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: a621ec302a701d7409616f47675d2df0afb87aca
          path: .ci-deps/download
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: 1.11.5
      - name: Карта типов фактического Core для synthetic fixtures
        run: (cd .ci-deps/exporter && quarto run tools/native-core-import-map.ts ../core "$RUNNER_TEMP/pl-native-imports.json" ../qrc ../download)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - name: Создать настоящие synthetic delivery4 packages вне Git
        env:
          EXPORTER_COMMIT: ${{ inputs.exporter_commit }}
        run: |
          export PL_DELIVERY4_FIXTURES="$RUNNER_TEMP/delivery4-fixtures"
          mkdir "$PL_DELIVERY4_FIXTURES"
          (cd .ci-deps/exporter && deno test --no-config --no-lock --import-map "$RUNNER_TEMP/pl-native-imports.json" -A tests/native-answer.test.ts tests/delivery4-workspace.test.ts)
          printf '%s\n' "$EXPORTER_COMMIT" > "$PL_DELIVERY4_FIXTURES/exporter-commit.txt"
          echo "PL_DELIVERY4_FIXTURES=$PL_DELIVERY4_FIXTURES" >> "$GITHUB_ENV"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.14.0'
      - name: Установить fish из официального зеркала Ubuntu
        timeout-minutes: 5
        shell: bash
        run: |
          test -f /etc/apt/apt-mirrors.txt
          test ! -L /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --signal=TERM --kill-after=5s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 --error-on=any update
          sudo timeout --signal=TERM --kill-after=5s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fish
      - name: Подготовить закреплённые Node зависимости проверок
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 120s npm ci --ignore-scripts --no-audit --no-fund
      - name: Собрать и проверить Java
        run: |
          python3 -m pip install --requirement requirements.txt
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f images/java25-grader/Dockerfile -t "$RUNTIME_IMAGE" .
          TEST_IMAGE_ID="$(docker image inspect "$RUNTIME_IMAGE" --format '{{.Id}}')"
          PL_TEST_IMAGE="$TEST_IMAGE_ID" PL_API_TEST_IMAGE="$TEST_IMAGE_ID" PL_NATIVE_PREPARED_IMAGE="$TEST_IMAGE_ID" python3 -m unittest discover -s tests -v
      - name: Собрать и проверить Community
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f images/prairielearn/Dockerfile -t "$COMMUNITY_IMAGE" .
          docker run --rm --entrypoint node "$COMMUNITY_IMAGE" --check /PrairieLearn/apps/prairielearn/bridge/server.mjs
          node --test tests/bridge/*.test.mjs
          python3 -B tests/bridge/enrollment-schema.test.py
          python3 tests/bridge/cookie-domain.test.py
          python3 tests/bridge/grader-patch.test.py
      - name: Собрать и проверить fish
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f images/fish-git-grader/Dockerfile -t "$FISH_IMAGE" .
          PL_FISH_TEST_IMAGE="$(docker image inspect "$FISH_IMAGE" --format '{{.Id}}')" python3 -m unittest discover -s tests -p 'test_fish*.py' -v
      - name: Собрать и проверить Workspace
        shell: bash
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$WORKSPACE_IMAGE" images/sp-git-workspace
          WORKSPACE_TEST_IMAGE="$(docker image inspect "$WORKSPACE_IMAGE" --format '{{.Id}}')"
          PYTHONPATH=tests/sp-git-workspace python3 tests/sp-git-workspace/container_smoke.py "$WORKSPACE_TEST_IMAGE" | tee "$RUNNER_TEMP/workspace-smoke.json"
      - name: Опубликовать Java
        run: docker push "$RUNTIME_IMAGE"
      - name: Опубликовать Community
        run: docker push "$COMMUNITY_IMAGE"
      - name: Опубликовать fish
        run: docker push "$FISH_IMAGE"
      - name: Опубликовать Workspace
        run: docker push "$WORKSPACE_IMAGE"
      - name: Проверить загрузку digest и сохранить receipt v3
        run: |
          export JAVA_DIGEST COMMUNITY_DIGEST FISH_DIGEST WORKSPACE_DIGEST
          JAVA_DIGEST="$(docker image inspect "$RUNTIME_IMAGE" --format '{{index .RepoDigests 0}}')"
          COMMUNITY_DIGEST="$(docker image inspect "$COMMUNITY_IMAGE" --format '{{index .RepoDigests 0}}')"
          FISH_DIGEST="$(docker image inspect "$FISH_IMAGE" --format '{{index .RepoDigests 0}}')"
          WORKSPACE_DIGEST="$(docker image inspect "$WORKSPACE_IMAGE" --format '{{index .RepoDigests 0}}')"
          for IMAGE in "$JAVA_DIGEST" "$COMMUNITY_DIGEST" "$FISH_DIGEST" "$WORKSPACE_DIGEST"; do docker pull "$IMAGE"; done
          python3 tools/publish-receipt.py
          cat runtime-image.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-runtime-digests-${{ inputs.version }}
          path: |
            runtime-image.json
            published-runtime-profiles.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-synthetic-native4-evidence-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/delivery4-fixtures/
            ${{ runner.temp }}/workspace-smoke.json
          if-no-files-found: error

  java:
    if: ${{ inputs.components == 'java' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Зафиксировать reviewed Java source
        env:
          VERSION: ${{ inputs.version }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$REVIEWED_COMMIT" ]] || exit 1
          [[ "$(cat VERSION)" == "$VERSION" ]] || exit 1
          echo "RUNTIME_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/java25-grader:${VERSION}" >> "$GITHUB_ENV"
      - name: Авторизоваться в registry для Java
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Подтвердить отсутствие Java tag
        run: bash tools/require-absent-image.sh "$RUNTIME_IMAGE"
      - name: Собрать и проверить Java
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f images/java25-grader/Dockerfile -t "$RUNTIME_IMAGE" .
          TEST_IMAGE_ID="$(docker image inspect "$RUNTIME_IMAGE" --format '{{.Id}}')"
          PL_TEST_IMAGE="$TEST_IMAGE_ID" python3 -m unittest discover -s tests -p test_plain_image.py -v
      - name: Опубликовать Java
        run: docker push "$RUNTIME_IMAGE"
      - name: Сохранить Java digest и image config ID
        run: |
          JAVA_DIGEST="$(docker image inspect "$RUNTIME_IMAGE" --format '{{index .RepoDigests 0}}')"
          IMAGE_ID="$(docker image inspect "$RUNTIME_IMAGE" --format '{{.Id}}')"
          PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/java25-grader@sha256:"
          [[ "$JAVA_DIGEST" == "$PREFIX"* ]] || exit 1
          HEX="${JAVA_DIGEST#"$PREFIX"}"
          [[ "$HEX" =~ ^[a-f0-9]{64}$ && "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          export JAVA_DIGEST IMAGE_ID
          python3 -c 'import json, os; print(json.dumps({"version": os.environ["RUNTIME_IMAGE"].rsplit(":", 1)[1], "source_commit": os.environ["GITHUB_SHA"], "repo_digest": os.environ["JAVA_DIGEST"], "image_config_id": os.environ["IMAGE_ID"]}, indent=2))' > java-image.json
          cat java-image.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-java-digest-${{ inputs.version }}
          path: java-image.json
          if-no-files-found: error

  community:
    if: ${{ inputs.components == 'community' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.14.0'
      - name: Зафиксировать reviewed Community source
        env:
          VERSION: ${{ inputs.version }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_SHA" == "$REVIEWED_COMMIT" ]] || exit 1
          [[ "$(cat VERSION)" == "$VERSION" ]] || exit 1
          echo "COMMUNITY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prairielearn-community-gateway:${VERSION}" >> "$GITHUB_ENV"
      - name: Проверить Community Source contracts
        run: |
          python3 -m pip install --requirement requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/bridge/*.test.mjs
          python3 -B tests/bridge/enrollment-schema.test.py
          for TEST in tests/recognized-*.test.mjs; do
            if [[ "$TEST" == tests/recognized-aggregate.test.mjs ]]; then
              python3 -B images/prairielearn/patch-recognized-credit.py --stdin assessment-grading < tests/fixtures/native-credit-upstream/dist/lib/assessment-grading.js > "$RUNNER_TEMP/recognized-assessment-grading.js"
              node "$TEST" --aggregate="$RUNNER_TEMP/recognized-assessment-grading.js"
            else
              node --test "$TEST"
            fi
          done
          python3 -B tests/bridge/cookie-domain.test.py
          python3 -B tests/bridge/grader-patch.test.py
          python3 -B tests/test_community_publication.py
      - name: Авторизоваться в registry для Community
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Подтвердить отсутствие только Community tag
        run: bash tools/require-absent-image.sh "$COMMUNITY_IMAGE"
      - name: Собрать и проверить только Community
        run: |
          docker build --pull=false --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f images/prairielearn/Dockerfile -t "$COMMUNITY_IMAGE" .
          docker run --rm --network=none --entrypoint node "$COMMUNITY_IMAGE" --check /PrairieLearn/apps/prairielearn/bridge/server.mjs
      - name: Опубликовать только Community
        run: docker push "$COMMUNITY_IMAGE"
      - name: Проверить Community digest и source readback
        run: |
          COMMUNITY_DIGEST="$(docker image inspect "$COMMUNITY_IMAGE" --format '{{index .RepoDigests 0}}')"
          PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prairielearn-community-gateway@sha256:"
          [[ "$COMMUNITY_DIGEST" == "$PREFIX"* ]] || exit 1
          HEX="${COMMUNITY_DIGEST#"$PREFIX"}"
          [[ "$HEX" =~ ^[a-f0-9]{64}$ ]] || exit 1
          docker pull "$COMMUNITY_DIGEST"
          [[ "$(docker image inspect "$COMMUNITY_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(docker image inspect "$COMMUNITY_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" == "https://github.com/$GITHUB_REPOSITORY" ]] || exit 1
          printf '%s\n' "$COMMUNITY_DIGEST" > community-image.txt
          docker image inspect "$COMMUNITY_DIGEST" > community-image-inspect.json
          printf 'Community %s\nSource %s\nImage %s\n' "$(cat VERSION)" "$GITHUB_SHA" "$COMMUNITY_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-community-digest-${{ inputs.version }}
          path: |
            community-image.txt
            community-image-inspect.json
          if-no-files-found: error
