name: Local contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - name: Установить fish для проверки текстового runtime
        timeout-minutes: 5
        run: |
          test -f /etc/apt/apt-mirrors.txt
          test ! -L /etc/apt/apt-mirrors.txt
          grep -Rq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --signal=TERM --kill-after=5s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 --error-on=any update
          sudo timeout --signal=TERM --kill-after=5s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fish
      - name: Подготовить закреплённые Python зависимости проверок
        run: |
          python3 -m venv "$RUNNER_TEMP/platform-ci"
          "$RUNNER_TEMP/platform-ci/bin/python" -m pip install --requirement requirements-dev.txt
          echo "$RUNNER_TEMP/platform-ci/bin" >> "$GITHUB_PATH"
      - name: Проверить native bridge и fail-closed patches
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run format:check
          ruff check .
          ruff format --check .
          pyright --pythonpath "$(command -v python3)"
          bandit -q -r tests -x tests/fixtures -t B301,B307,B501,B506,B602,B605
          bandit -q -r . -x ./tests,./node_modules,./runtime/java25-junit-v1/upstream
          yamllint .github ansible compose examples .yamllint.yml
          sqlfluff lint bridge
          node --test tests/bridge/*.test.mjs
          node --test tests/integer-manual-points.test.mjs
          python3 -B tests/bridge/enrollment-schema.test.py
          python3 tests/bridge/cookie-domain.test.py
          python3 tests/bridge/grader-patch.test.py
      - name: Actual Java runtime and synthetic contracts
        run: |
          java -version
          javac -version
          # Exercise the compiler before the suite's intentionally bounded
          # subprocesses. A cold runner exceeded the 5s compile budget once.
          TASK_CI_WARMUP_DIR=$(mktemp -d)
          echo 'public class CompilerReady {}' > "$TASK_CI_WARMUP_DIR/CompilerReady.java"
          javac --release 25 -d "$TASK_CI_WARMUP_DIR" "$TASK_CI_WARMUP_DIR/CompilerReady.java"
          python3 -m unittest discover -s tests -v

  java-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.14.0"
      - name: Собрать обычный Dockerfile Java grader
        run: docker build -f images/java25-grader/Dockerfile -t local/platform-java:ci .
      - name: Проверить публичный результат grader в собранном образе
        run: |
          PL_TEST_IMAGE="$(docker image inspect local/platform-java:ci --format '{{.Id}}')" python3 -m unittest discover -s tests -p test_plain_image.py -v

  quality:
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux@sha256:97119fd9e21219b02b3c14ba256c9d3c0d031d07fc26c836c41ed793beeb5b74
    steps:
      - name: Установить штатные инструменты анализа
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm python python-pip jdk25-openjdk maven ruff pyright bandit sqlfluff yamllint ansible-lint opentofu tflint taplo-cli actionlint shellcheck shfmt clang jq libxml2 curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Установить официальный Hadolint binary
        run: |
          curl --fail --location --silent --show-error https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o "$RUNNER_TEMP/hadolint-linux-x86_64"
          curl --fail --location --silent --show-error https://github.com/hadolint/hadolint/releases/download/v2.15.1/checksums.sha256 -o "$RUNNER_TEMP/checksums.sha256"
          (cd "$RUNNER_TEMP" && grep -E ' [*]hadolint-linux-x86_64$' checksums.sha256 | sha256sum --check --strict)
          install -m 0755 "$RUNNER_TEMP/hadolint-linux-x86_64" /usr/local/bin/hadolint
      - name: Подготовить обычные devDependencies
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-25-openjdk
          export PATH="$JAVA_HOME/bin:$PATH"
          python -m venv "$RUNNER_TEMP/platform-quality"
          "$RUNNER_TEMP/platform-quality/bin/python" -m pip install --requirement requirements-dev.txt
          echo "$RUNNER_TEMP/platform-quality/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-25-openjdk/bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
          mvn -B -q -f tools/quality/pom.xml dependency:copy -Dartifact=com.google.googlejavaformat:google-java-format:2.0.0:jar:all-deps -DoutputDirectory="$RUNNER_TEMP/platform-java-tools"
          echo "JAVA_FORMAT_JAR=$RUNNER_TEMP/platform-java-tools/google-java-format-2.0.0-all-deps.jar" >> "$GITHUB_ENV"
          mvn -B -q -f tools/quality/pom.xml -Pspotbugs dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/spotbugs-classpath"
          mvn -B -q -f tools/quality/pom.xml -Perrorprone dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/errorprone-classpath"
      - name: Проверить все собственные исходники и схемы provider
        run: |
          SPOTBUGS_CLASSPATH="$(cat "$RUNNER_TEMP/spotbugs-classpath")"
          ERROR_PRONE_CLASSPATH="$(cat "$RUNNER_TEMP/errorprone-classpath")"
          export SPOTBUGS_CLASSPATH ERROR_PRONE_CLASSPATH
          export ANSIBLE_HOME="$RUNNER_TEMP/platform-ansible"
          export ANSIBLE_LOCAL_TEMP="$RUNNER_TEMP/platform-ansible/tmp"
          export XDG_CACHE_HOME="$RUNNER_TEMP/platform-quality-cache"
          tools/check-quality.sh
          tools/quality/controls.sh
      - name: Сохранить полный Bandit audit с рассмотренными контекстами
        if: always()
        run: |
          set +e
          bandit -r . -x ./tests,./node_modules,./runtime/java25-junit-v1/upstream --ignore-nosec --format json --output "$RUNNER_TEMP/platform-bandit-audit.json"
          quality_audit_status=$?
          set -e
          test "$quality_audit_status" -eq 0 || test "$quality_audit_status" -eq 1
          jq -e '.errors | length == 0' "$RUNNER_TEMP/platform-bandit-audit.json"
          cat "$RUNNER_TEMP/platform-bandit-audit.json"
