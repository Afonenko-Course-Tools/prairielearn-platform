name: Local contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Установить fish для проверки текстового runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish
      - name: Подготовить закреплённые Python зависимости проверок
        run: |
          python3 -m venv "$RUNNER_TEMP/platform-ci"
          "$RUNNER_TEMP/platform-ci/bin/python" -m pip install --requirement requirements.txt
          echo "$RUNNER_TEMP/platform-ci/bin" >> "$GITHUB_PATH"
      - name: Проверить native bridge и fail-closed patches
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/bridge/*.test.mjs
          python3 tests/bridge/cookie-domain.test.py
          python3 tests/bridge/grader-patch.test.py
      - name: Actual Java runtime and synthetic contracts
        run: |
          java -version
          javac -version
          # Exercise the compiler before the suite's intentionally bounded
          # subprocesses. A cold runner exceeded the 5s compile budget once.
          TASK_CI_WARMUP_DIR=$(mktemp -d)
          echo 'public class CompilerReady {}' > "$TASK_CI_WARMUP_DIR/CompilerReady.java"
          javac --release 25 -d "$TASK_CI_WARMUP_DIR" "$TASK_CI_WARMUP_DIR/CompilerReady.java"
          python3 -m unittest discover -s tests -v

  native-toolchain-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.14.0'
      - name: Проверить границы подготовки
        run: python3 -m unittest discover -s tests -p test_native_toolchain_preparation.py -v
      - name: Подготовить фиксированные публичные inputs и base
        run: |
          python3 tools/prepare_native_toolchain.py --fetch
          python3 tools/prepare_native_toolchain.py --verify-context
          python3 tools/prepare_native_toolchain.py --write-build-context "$RUNNER_TEMP/native-build-context.tar"
          docker pull ghcr.io/afonenko-course-tools/java25-grader@sha256:6052b077f7d5fabaedbd2deb829eed15e9911beafaf78f29c90083ff917b8c17
      - name: Выполнить clean Dockerfile build без сетевых RUN
        env:
          DOCKER_BUILDKIT: '0'
        run: |
          docker version
          docker image inspect ghcr.io/afonenko-course-tools/java25-grader@sha256:6052b077f7d5fabaedbd2deb829eed15e9911beafaf78f29c90083ff917b8c17
          timeout --signal=TERM --kill-after=5s 360s docker build --pull=false --network=none --no-cache --rm=true --force-rm --memory=2g --memory-swap=2g --cpu-period=100000 --cpu-quota=200000 --ulimit=nofile=4096:4096 --ulimit=core=0:0 -f images/java25-grader/Dockerfile -t local/platform-native-toolchain:ci - < "$RUNNER_TEMP/native-build-context.tar"
          python3 tools/prepare_native_toolchain.py --verify-context
      - name: Проверить независимый readback и конечный synthetic runtime smoke
        run: |
          PL_NATIVE_PREPARED_IMAGE="$(docker image inspect local/platform-native-toolchain:ci --format '{{.Id}}')" python3 -m unittest discover -s tests -p test_native_toolchain_image.py -v

  publication-conditions-private-source:
    name: Публикационные архивы из настоящего private stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 7d8a472a0fe4f05b5543fb856336a6d15278ef3a
          path: .ci-deps/core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          # Независимый кандидат Exporter 8.2.3, родитель принятой линии 8.2.1.
          ref: 149af3a8597691c3024ecbf0325647a8d102e7cc
          path: .ci-deps/exporter
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: 2dd97d8ce28c4ad514e869fe86d25dbc19f79def
          path: .ci-deps/download
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/prairielearn-platform
          ref: c0208e16d2480b45d0cf0ef3c44ed706aee293f0
          fetch-depth: 0
          path: .ci-deps/runtime-platform
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.14.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c
        with:
          version: v0.17.1
      - name: Подготовить три точных опубликованных asset 2.3.0 и фактические Java/fish images
        run: |
          mkdir -m 700 "$RUNNER_TEMP/runtime-assets"
          for NAME in runtime-image.json published-runtime-profiles.json published-toolchain-lock.json; do
            curl --fail --location --max-time 60 --output "$RUNNER_TEMP/runtime-assets/$NAME" "https://github.com/Afonenko-Course-Tools/prairielearn-platform/releases/download/v2.3.0/$NAME"
          done
          docker pull ghcr.io/afonenko-course-tools/java25-grader@sha256:a1221ab6cecd0ba4d0cc5f06b9aa2a671d79fc5fa54303cfaa612316b006c59e
          docker pull ghcr.io/afonenko-course-tools/fish-git-grader@sha256:030828d3a6c7c17c13682a74dd3936b9e539cefc1f35cd6134aed1cebdcebd9e
      - name: Проверить exact c020 CLI с inherited ENV и настоящим private stage
        run: |
          test "$(git -C .ci-deps/core rev-parse HEAD)" = "7d8a472a0fe4f05b5543fb856336a6d15278ef3a"
          test "$(git -C .ci-deps/exporter rev-parse HEAD)" = "149af3a8597691c3024ecbf0325647a8d102e7cc"
          test "$(git -C .ci-deps/download rev-parse HEAD)" = "2dd97d8ce28c4ad514e869fe86d25dbc19f79def"
          python3 -m pip install --requirement requirements.txt
          test "$(git -C .ci-deps/runtime-platform rev-parse HEAD)" = "c0208e16d2480b45d0cf0ef3c44ed706aee293f0"
          test "$(git -C .ci-deps/runtime-platform rev-parse 'v2.3.0^{commit}')" = "c0208e16d2480b45d0cf0ef3c44ed706aee293f0"
          PYTHONDONTWRITEBYTECODE=1 CORE="$PWD/.ci-deps/core" EXPORTER="$PWD/.ci-deps/exporter" DOWNLOAD="$PWD/.ci-deps/download" OLD_PLATFORM="$PWD/.ci-deps/runtime-platform" OLD_RELEASE_ASSETS="$RUNNER_TEMP/runtime-assets" python3 -m unittest discover -s tests -p test_private_source_native.py -v
