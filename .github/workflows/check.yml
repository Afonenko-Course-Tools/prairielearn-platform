name: Local contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          ref: c41486739de77ab1e0ccef29f01ad08c49816a96
          path: .ci-deps/exporter
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - name: Создать настоящие synthetic delivery4 packages вне Git
        run: |
          test "$(git -C .ci-deps/exporter rev-parse HEAD)" = c41486739de77ab1e0ccef29f01ad08c49816a96
          export PL_DELIVERY4_FIXTURES="$RUNNER_TEMP/delivery4-fixtures"
          mkdir "$PL_DELIVERY4_FIXTURES"
          (cd .ci-deps/exporter && deno test --no-config --no-lock -A tests/native-answer.test.ts tests/delivery4-workspace.test.ts)
          printf '%s\n' c41486739de77ab1e0ccef29f01ad08c49816a96 > "$PL_DELIVERY4_FIXTURES/exporter-commit.txt"
          echo "PL_DELIVERY4_FIXTURES=$PL_DELIVERY4_FIXTURES" >> "$GITHUB_ENV"
      - name: Установить fish для проверки текстового runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish
      - name: Подготовить закреплённые Python зависимости проверок
        run: |
          python3 -m venv "$RUNNER_TEMP/platform-ci"
          "$RUNNER_TEMP/platform-ci/bin/python" -m pip install --requirement requirements.txt
          echo "$RUNNER_TEMP/platform-ci/bin" >> "$GITHUB_PATH"
      - name: Проверить native bridge и fail-closed patches
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/bridge/*.test.mjs
          python3 tests/bridge/cookie-domain.test.py
          python3 tests/bridge/grader-patch.test.py
      - name: Actual Java runtime and synthetic contracts
        run: |
          java -version
          javac -version
          # Exercise the compiler before the suite's intentionally bounded
          # subprocesses. A cold runner exceeded the 5s compile budget once.
          TASK_CI_WARMUP_DIR=$(mktemp -d)
          echo 'public class CompilerReady {}' > "$TASK_CI_WARMUP_DIR/CompilerReady.java"
          javac --release 25 -d "$TASK_CI_WARMUP_DIR" "$TASK_CI_WARMUP_DIR/CompilerReady.java"
          python3 -m unittest discover -s tests -v

  java-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.14.0'
      - name: Собрать обычный Dockerfile Java grader
        run: docker build -f images/java25-grader/Dockerfile -t local/platform-java:ci .
      - name: Проверить публичный результат grader в собранном образе
        run: |
          PL_TEST_IMAGE="$(docker image inspect local/platform-java:ci --format '{{.Id}}')" python3 -m unittest discover -s tests -p test_plain_image.py -v
